name: Build Mod Package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      modio_file_id:
        description: Existing mod.io file ID to finalize without uploading a duplicate
        required: false
        type: string
      modio_version_tag:
        description: Existing release tag to publish only to mod.io
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    if: github.event_name != 'workflow_dispatch' || (inputs.modio_file_id == '' && inputs.modio_version_tag == '')
    runs-on: windows-latest
    environment: TgBot
    env:
      TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
      TG_THREAD_ID: ${{ secrets.TG_THREAD_ID }}

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare workspace
        run: |
          $ErrorActionPreference = "Stop"

          if (-not (Test-Path -LiteralPath "Mods\\DnD 5.5e AIO Russian\\Localization\\Russian\\russian.xml")) {
              throw "Repository sources are not available in the runner workspace."
          }

          New-Item -ItemType Directory -Path ".tools\\lslib" -Force | Out-Null
          New-Item -ItemType Directory -Path "build" -Force | Out-Null

      - name: Resolve version tag
        id: vars
        run: |
          $ErrorActionPreference = "Stop"
          $versionTag = ""
          $isPrerelease = "false"
          if ($env:GITHUB_REF -like "refs/tags/v*") {
              $versionTag = $env:GITHUB_REF_NAME
              if ($versionTag -match '^v\d+\.\d+\.\d+-') {
                  $isPrerelease = "true"
              }
          }
          "version_tag=$versionTag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "is_prerelease=$isPrerelease" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Notify Telegram about build start
        if: startsWith(github.ref, 'refs/tags/v') && env.TG_CHAT_ID != '' && env.TG_THREAD_ID != '' && env.TG_BOT_TOKEN != ''
        continue-on-error: true
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          $target = if ("${{ steps.vars.outputs.version_tag }}") { "${{ steps.vars.outputs.version_tag }}" } else { "${{ github.ref_name }}" }
          $runUrl = "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          $text = "⏳ <b>Старт сборки релиза</b>`n<b>Репозиторий:</b> <code>${{ github.repository }}</code>`n<b>Тег:</b> <code>$target</code>`n<a href=`"$runUrl`">Открыть лог сборки</a>"
          .\scripts\send-telegram-notification.ps1 -BotToken $env:TG_BOT_TOKEN -ChatId $env:TG_CHAT_ID -ThreadId $env:TG_THREAD_ID -Text $text -DisableNotification

      - name: Download latest LSLib release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          $headers = @{
              Authorization = "Bearer $env:GH_TOKEN"
              Accept = "application/vnd.github+json"
              "X-GitHub-Api-Version" = "2022-11-28"
          }
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/Norbyte/lslib/releases/latest" -Headers $headers
          $asset = $release.assets | Where-Object { $_.name -match '\.zip$' } | Select-Object -First 1

          if (-not $asset) {
              throw "Could not find a downloadable LSLib zip asset in the latest release."
          }

          Invoke-WebRequest -UseBasicParsing -Uri $asset.browser_download_url -OutFile ".tools/lslib/lslib.zip"
          Expand-Archive -LiteralPath ".tools/lslib/lslib.zip" -DestinationPath ".tools/lslib" -Force

      - name: Build .pak
        run: |
          $ErrorActionPreference = "Stop"
          $divine = Get-ChildItem -Path ".tools\\lslib" -Recurse -File |
            Where-Object { $_.Name -ieq "Divine.exe" } |
            Select-Object -First 1

          if (-not $divine) {
              throw "Divine.exe was not found in the downloaded LSLib release."
          }

          & ".\\scripts\\build.ps1" -DivinePath $divine.FullName -Workspace "${{ github.workspace }}" -VersionTag "${{ steps.vars.outputs.version_tag }}"

      - name: Show build result
        run: |
          $ErrorActionPreference = "Stop"
          $archiveBaseName = "DnD 5.5e AIO Russian"
          if ($env:GITHUB_REF -like "refs/tags/v*") {
              $archiveBaseName = "DnD 5.5e AIO Russian $env:GITHUB_REF_NAME"
          }
          $zipPath = [System.IO.Path]::GetFullPath((Join-Path "${{ github.workspace }}" "build/$archiveBaseName.zip"))

          Get-ChildItem "build/DnD 5.5e AIO Russian.pak", "build/info.json", $zipPath |
            Select-Object FullName, Length, LastWriteTime

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bg3-dnd55e-russian-localization-${{ github.run_number }}
          path: build/*
          if-no-files-found: error

      - name: Create or update GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          $tagName = "${{ github.ref_name }}"
          $zipPath = Join-Path $env:GITHUB_WORKSPACE "build\\DnD 5.5e AIO Russian $tagName.zip"
          $assetLabel = "DnD 5.5e AIO Russian $tagName.zip"
          $releaseAsset = "$zipPath#$assetLabel"
          $expectedAssetName = "DnD.5.5e.AIO.Russian.$tagName.zip"
          $isPrerelease = "${{ steps.vars.outputs.is_prerelease }}" -eq "true"

          if (-not (Test-Path -LiteralPath $zipPath)) {
              throw "Release archive was not found at '$zipPath'."
          }

          gh release view $tagName --repo "${{ github.repository }}" *> $null

          if ($LASTEXITCODE -ne 0) {
              $args = @(
                "release", "create", $tagName, $releaseAsset,
                "--repo", "${{ github.repository }}",
                "--title", $tagName,
                "--notes", ""
              )

              if ($isPrerelease) {
                  $args += "--prerelease"
              }

              gh @args
          }
          else {
              gh release upload $tagName $releaseAsset `
                --repo "${{ github.repository }}" `
                --clobber

              $releaseId = gh api `
                "/repos/${{ github.repository }}/releases/tags/$tagName" `
                --jq ".id"

              $releaseBodyPath = Join-Path $env:RUNNER_TEMP "release-body.json"
              @{
                name = $tagName
                prerelease = $isPrerelease
              } | ConvertTo-Json -Compress | Set-Content -LiteralPath $releaseBodyPath -Encoding utf8

              gh api `
                --method PATCH `
                -H "Accept: application/vnd.github+json" `
                "/repos/${{ github.repository }}/releases/$releaseId" `
                --input $releaseBodyPath
          }

          $release = gh api `
            "/repos/${{ github.repository }}/releases/tags/$tagName" |
            ConvertFrom-Json
          $asset = @($release.assets) |
            Where-Object { $_.name -eq $expectedAssetName } |
            Select-Object -First 1

          if ($null -eq $asset) {
              $actualAssetNames = @($release.assets | ForEach-Object { $_.name }) -join ", "
              throw "Expected GitHub asset '$expectedAssetName', actual assets: $actualAssetNames"
          }

          if ($asset.label -ne $assetLabel) {
              throw "Expected GitHub asset label '$assetLabel', actual label: '$($asset.label)'"
          }

      - name: Notify Telegram about build success
        if: success() && startsWith(github.ref, 'refs/tags/v') && env.TG_CHAT_ID != '' && env.TG_THREAD_ID != '' && env.TG_BOT_TOKEN != ''
        continue-on-error: true
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          $releaseUrl = "${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}"
          $text = "🏁 <b>Релиз собран успешно</b>`n<b>Тег:</b> <code>${{ github.ref_name }}</code>`n<a href=`"$releaseUrl`">Открыть готовый релиз</a>"
          .\scripts\send-telegram-notification.ps1 -BotToken $env:TG_BOT_TOKEN -ChatId $env:TG_CHAT_ID -ThreadId $env:TG_THREAD_ID -Text $text -DisableNotification

      - name: Notify Telegram about build failure
        if: failure() && startsWith(github.ref, 'refs/tags/v') && env.TG_CHAT_ID != '' && env.TG_THREAD_ID != '' && env.TG_BOT_TOKEN != ''
        continue-on-error: true
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          $runUrl = "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          $text = "❌ <b>Сборка релиза завершилась ошибкой</b>`n<b>Тег:</b> <code>${{ github.ref_name }}</code>`n<a href=`"$runUrl`">Открыть лог сборки</a>"
          .\scripts\send-telegram-notification.ps1 -BotToken $env:TG_BOT_TOKEN -ChatId $env:TG_CHAT_ID -ThreadId $env:TG_THREAD_ID -Text $text

  upload_to_nexusmods:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment: NexusMods

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: bg3-dnd55e-russian-localization-${{ github.run_number }}
          path: build

      - name: Resolve Nexus upload metadata
        id: vars
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $tagName = "${{ github.ref_name }}"
          if (-not $tagName) {
              throw "Git tag name is required for Nexus Mods upload."
          }

          $version = $tagName
          if ($version.StartsWith("v")) {
              $version = $version.Substring(1)
          }

          $zipName = "DnD 5.5e AIO Russian $tagName.zip"
          $zipPath = Join-Path "${{ github.workspace }}" "build/$zipName"
          if (-not (Test-Path -LiteralPath $zipPath)) {
              throw "Release archive was not found at '$zipPath'."
          }

          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "zip_path=$zipPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "zip_name=$zipName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Upload release to Nexus Mods
        id: nexus_upload_1
        continue-on-error: true
        uses: Nexus-Mods/upload-action@v1.0.0-beta.4
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          file_group_id: ${{ vars.NEXUSMODS_FILE_GROUP_ID }}
          filename: ${{ steps.vars.outputs.zip_path }}
          version: ${{ steps.vars.outputs.version }}
          display_name: ${{ steps.vars.outputs.zip_name }}
          description: GitHub release ${{ github.ref_name }}
          file_category: main

      - name: Wait before Nexus Mods upload retry
        if: steps.nexus_upload_1.outcome == 'failure'
        shell: pwsh
        run: Start-Sleep -Seconds 30

      - name: Retry Nexus Mods upload after transient failure
        id: nexus_upload_2
        if: steps.nexus_upload_1.outcome == 'failure'
        continue-on-error: true
        uses: Nexus-Mods/upload-action@v1.0.0-beta.4
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          file_group_id: ${{ vars.NEXUSMODS_FILE_GROUP_ID }}
          filename: ${{ steps.vars.outputs.zip_path }}
          version: ${{ steps.vars.outputs.version }}
          display_name: ${{ steps.vars.outputs.zip_name }}
          description: GitHub release ${{ github.ref_name }}
          file_category: main

      - name: Wait before final Nexus Mods upload retry
        if: steps.nexus_upload_1.outcome == 'failure' && steps.nexus_upload_2.outcome == 'failure'
        shell: pwsh
        run: Start-Sleep -Seconds 60

      - name: Retry Nexus Mods upload one last time
        id: nexus_upload_3
        if: steps.nexus_upload_1.outcome == 'failure' && steps.nexus_upload_2.outcome == 'failure'
        continue-on-error: true
        uses: Nexus-Mods/upload-action@v1.0.0-beta.4
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          file_group_id: ${{ vars.NEXUSMODS_FILE_GROUP_ID }}
          filename: ${{ steps.vars.outputs.zip_path }}
          version: ${{ steps.vars.outputs.version }}
          display_name: ${{ steps.vars.outputs.zip_name }}
          description: GitHub release ${{ github.ref_name }}
          file_category: main

      - name: Confirm Nexus Mods upload
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $outcomes = @(
            "${{ steps.nexus_upload_1.outcome }}",
            "${{ steps.nexus_upload_2.outcome }}",
            "${{ steps.nexus_upload_3.outcome }}"
          )

          if ($outcomes -notcontains "success") {
              throw "Nexus Mods upload failed after 3 attempts."
          }

  publish_to_modio:
    if: >-
      always() &&
      (
        (startsWith(github.ref, 'refs/tags/v') &&
          needs.build.result == 'success' &&
          needs.upload_to_nexusmods.result == 'success') ||
        (github.event_name == 'workflow_dispatch' &&
          inputs.modio_version_tag != '' &&
          inputs.modio_file_id == '' &&
          needs.build.result == 'skipped' &&
          needs.upload_to_nexusmods.result == 'skipped')
      )
    needs: [build, upload_to_nexusmods]
    runs-on: [self-hosted, Windows, bg3-toolkit]
    environment: Mod.io

    defaults:
      run:
        shell: powershell

    env:
      BG3TOOL_PATH: ${{ vars.BG3TOOL_PATH }}
      MODIO_ACCESS_TOKEN: ${{ secrets.MODIO_ACCESS_TOKEN }}
      MODIO_API_BASE: ${{ vars.MODIO_API_BASE }}
      MODIO_GAME_ID: ${{ vars.MODIO_GAME_ID }}
      MODIO_MOD_ID: ${{ vars.MODIO_MOD_ID }}
      MODIO_PLATFORMS: ${{ vars.MODIO_PLATFORMS }}
      MODIO_BROWSER_PATH: ${{ vars.MODIO_BROWSER_PATH }}
      BG3_PARENT_MOD_REPO: ${{ vars.BG3_PARENT_MOD_REPO }}
      BG3_PARENT_MOD_BRANCH: ${{ vars.BG3_PARENT_MOD_BRANCH }}
      MODIO_VERSION_TAG: ${{ inputs.modio_version_tag || github.ref_name }}
      TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
      TG_THREAD_ID: ${{ secrets.TG_THREAD_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout requested release sources
        if: github.event_name == 'workflow_dispatch' && inputs.modio_version_tag != ''
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.modio_version_tag }}
          path: release-source

      - name: Notify Telegram about mod.io publish start
        if: env.TG_CHAT_ID != '' && env.TG_THREAD_ID != '' && env.TG_BOT_TOKEN != ''
        continue-on-error: true
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          $runUrl = "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          $text = "⏳ <b>Публикация на mod.io начата</b>`n<b>Тег:</b> <code>$env:MODIO_VERSION_TAG</code>`n<a href=`"$runUrl`">Открыть лог</a>"
          .\scripts\send-telegram-notification.ps1 -BotToken $env:TG_BOT_TOKEN -ChatId $env:TG_CHAT_ID -ThreadId $env:TG_THREAD_ID -Text $text -DisableNotification

      - name: Publish release to mod.io
        run: |
          $ErrorActionPreference = "Stop"
          $bg3ToolPath = $env:BG3TOOL_PATH
          if (-not $bg3ToolPath) {
              $bg3ToolPath = "C:\Program Files (x86)\Steam\steamapps\common\Baldurs Gate 3 Toolkit\Glasses.exe"
          }
          $publishWorkspace = "${{ github.workspace }}"
          if ($env:GITHUB_EVENT_NAME -eq "workflow_dispatch") {
              $publishWorkspace = Join-Path $env:GITHUB_WORKSPACE "release-source"
          }

          .\scripts\publish-modio.ps1 `
            -VersionTag $env:MODIO_VERSION_TAG `
            -Workspace $publishWorkspace `
            -Bg3ToolPath $bg3ToolPath

      - name: Notify Telegram about mod.io publish success
        if: success() && env.TG_CHAT_ID != '' && env.TG_THREAD_ID != '' && env.TG_BOT_TOKEN != ''
        continue-on-error: true
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          $modioUrl = "https://mod.io/g/baldursgate3/m/dnd-55e-all-in-one-beyond-russian-localization"
          $text = "✅ <b>Опубликовано на mod.io</b>`n<b>Тег:</b> <code>$env:MODIO_VERSION_TAG</code>`n<a href=`"$modioUrl`">Открыть страницу мода</a>"
          .\scripts\send-telegram-notification.ps1 -BotToken $env:TG_BOT_TOKEN -ChatId $env:TG_CHAT_ID -ThreadId $env:TG_THREAD_ID -Text $text -DisableNotification

      - name: Notify Telegram about mod.io publish failure
        if: failure() && env.TG_CHAT_ID != '' && env.TG_THREAD_ID != '' && env.TG_BOT_TOKEN != ''
        continue-on-error: true
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          $runUrl = "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          $text = "❌ <b>Ошибка публикации на mod.io</b>`n<b>Тег:</b> <code>$env:MODIO_VERSION_TAG</code>`n<a href=`"$runUrl`">Открыть лог</a>"
          .\scripts\send-telegram-notification.ps1 -BotToken $env:TG_BOT_TOKEN -ChatId $env:TG_CHAT_ID -ThreadId $env:TG_THREAD_ID -Text $text

  finalize_existing_modio:
    if: github.event_name == 'workflow_dispatch' && inputs.modio_file_id != '' && inputs.modio_version_tag == ''
    runs-on: [self-hosted, Windows, bg3-toolkit]
    environment: Mod.io

    defaults:
      run:
        shell: powershell

    env:
      MODIO_BROWSER_PATH: ${{ vars.MODIO_BROWSER_PATH }}
      MODIO_PLATFORMS: ${{ vars.MODIO_PLATFORMS }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Finalize existing mod.io file
        run: |
          $ErrorActionPreference = "Stop"
          $platforms = if ($env:MODIO_PLATFORMS) {
              @($env:MODIO_PLATFORMS -split "," | ForEach-Object { $_.Trim() } | Where-Object { $_ })
          } else {
              @("windows", "mac", "xboxseriesx", "ps5")
          }

          .\scripts\publish-modio-web.ps1 `
            -FileId ([int64]"${{ inputs.modio_file_id }}") `
            -Platforms $platforms `
            -TimeoutSeconds 180
