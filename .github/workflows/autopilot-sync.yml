name: Autopilot Sync

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      mode_override:
        description: "Переопределение режима автопилота"
        required: false
        default: "inherit"
        type: choice
        options:
          - inherit
          - off
          - sync_only
          - full
      force_check:
        description: "Запустить обработку даже без нового hash upstream"
        required: false
        default: false
        type: boolean
      force_release:
        description: "Разрешить создание тега в режиме full даже без новых правок"
        required: false
        default: false
        type: boolean
      release_channel:
        description: "Канал релиза для режима full"
        required: false
        default: stable
        type: choice
        options:
          - stable
          - prerelease
      custom_tag:
        description: "Свой тег релиза"
        required: false
        default: ""
        type: string
      include_existing:
        description: "Переводить заново уже заполненные кандидаты"
        required: false
        default: false
        type: boolean
      reason:
        description: "Причина ручного запуска"
        required: false
        default: ""
        type: string

permissions:
  contents: write

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

concurrency:
  group: autopilot-sync-${{ github.repository }}-${{ github.ref_name || github.event.repository.default_branch || 'default' }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: windows-latest
    environment: AUTOPILOT_MODE
    outputs:
      effective_mode: ${{ steps.preflight.outputs.effective_mode }}
      mode_source: ${{ steps.preflight.outputs.mode_source }}
      mode_override: ${{ steps.preflight.outputs.mode_override }}
      force_check: ${{ steps.preflight.outputs.force_check }}
      force_release: ${{ steps.preflight.outputs.force_release }}
      include_existing: ${{ steps.preflight.outputs.include_existing }}
      release_channel: ${{ steps.preflight.outputs.release_channel }}
      custom_tag: ${{ steps.preflight.outputs.custom_tag }}
      reason: ${{ steps.preflight.outputs.reason }}
      upstream_changed: ${{ steps.preflight.outputs.upstream_changed }}
      previous_sha256: ${{ steps.preflight.outputs.previous_sha256 }}
      current_sha256: ${{ steps.preflight.outputs.current_sha256 }}
      should_process: ${{ steps.preflight.outputs.should_process }}
      run_trigger: ${{ steps.preflight.outputs.run_trigger }}
      git_author_name: ${{ steps.preflight.outputs.git_author_name }}
      git_author_email: ${{ steps.preflight.outputs.git_author_email }}

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Prepare workspace
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Path "build/autopilot" -Force | Out-Null
          New-Item -ItemType Directory -Path ".cache/upstream" -Force | Out-Null

      - name: Check upstream english.xml
        run: |
          $ErrorActionPreference = "Stop"
          $force = "${{ github.event.inputs.force_check || 'false' }}"
          $args = @(
            "scripts/check-upstream-change.py",
            "--state-path", ".github/autopilot/state.json",
            "--download-path", ".cache/upstream/english.xml",
            "--output-path", "build/autopilot/upstream-check.json"
          )

          if ($force -eq "true") {
            $args += "--force"
          }

          python @args

      - name: Resolve preflight
        id: preflight
        env:
          AUTOPILOT_MODE: ${{ vars.AUTOPILOT_MODE }}
          AUTOPILOT_GIT_AUTHOR_NAME: ${{ vars.AUTOPILOT_GIT_AUTHOR_NAME }}
          AUTOPILOT_GIT_AUTHOR_EMAIL: ${{ vars.AUTOPILOT_GIT_AUTHOR_EMAIL }}
          AUTOPILOT_DEFAULT_RELEASE_CHANNEL: ${{ vars.AUTOPILOT_DEFAULT_RELEASE_CHANNEL }}
          INPUT_MODE_OVERRIDE: ${{ github.event.inputs.mode_override || 'inherit' }}
          INPUT_FORCE_CHECK: ${{ github.event.inputs.force_check || 'false' }}
          INPUT_FORCE_RELEASE: ${{ github.event.inputs.force_release || 'false' }}
          INPUT_RELEASE_CHANNEL: ${{ github.event.inputs.release_channel || '' }}
          INPUT_CUSTOM_TAG: ${{ github.event.inputs.custom_tag || '' }}
          INPUT_INCLUDE_EXISTING: ${{ github.event.inputs.include_existing || 'false' }}
          INPUT_REASON: ${{ github.event.inputs.reason || '' }}
        run: |
          $ErrorActionPreference = "Stop"
          $report = Get-Content -Raw "build/autopilot/upstream-check.json" | ConvertFrom-Json

          $modeOverride = ($env:INPUT_MODE_OVERRIDE ?? "").Trim()
          if ([string]::IsNullOrWhiteSpace($modeOverride)) {
            $modeOverride = "inherit"
          }

          $repoMode = ($env:AUTOPILOT_MODE ?? "").Trim().ToLowerInvariant()
          if ([string]::IsNullOrWhiteSpace($repoMode)) {
            $repoMode = "off"
          }

          $effectiveMode = if ($modeOverride -ne "inherit") { $modeOverride.ToLowerInvariant() } else { $repoMode }
          if ($effectiveMode -notin @("off", "sync_only", "full")) {
            $effectiveMode = "off"
          }

          $modeSource = if ($modeOverride -ne "inherit") { "override" } else { "environment" }
          $forceCheck = (($env:INPUT_FORCE_CHECK ?? "false").Trim().ToLowerInvariant() -eq "true")
          $forceRelease = (($env:INPUT_FORCE_RELEASE ?? "false").Trim().ToLowerInvariant() -eq "true")
          $includeExisting = (($env:INPUT_INCLUDE_EXISTING ?? "false").Trim().ToLowerInvariant() -eq "true")
          $releaseChannel = ($env:INPUT_RELEASE_CHANNEL ?? "").Trim().ToLowerInvariant()
          if ([string]::IsNullOrWhiteSpace($releaseChannel)) {
            $releaseChannel = ($env:AUTOPILOT_DEFAULT_RELEASE_CHANNEL ?? "").Trim().ToLowerInvariant()
          }
          if ([string]::IsNullOrWhiteSpace($releaseChannel) -or $releaseChannel -notin @("stable", "prerelease")) {
            $releaseChannel = "stable"
          }

          $upstreamChanged = [bool]$report.changed
          $shouldProcess = $effectiveMode -ne "off" -and ($upstreamChanged -or $forceCheck -or $forceRelease)
          $runTrigger = if ("${{ github.event_name }}" -eq "workflow_dispatch") { "manual" } else { "${{ github.event_name }}" }

          $gitAuthorName = ($env:AUTOPILOT_GIT_AUTHOR_NAME ?? "").Trim()
          if ([string]::IsNullOrWhiteSpace($gitAuthorName)) {
            $gitAuthorName = "bg3-dnd55e autopilot"
          }

          $gitAuthorEmail = ($env:AUTOPILOT_GIT_AUTHOR_EMAIL ?? "").Trim()
          if ([string]::IsNullOrWhiteSpace($gitAuthorEmail)) {
            $gitAuthorEmail = "autopilot@users.noreply.github.com"
          }

          "effective_mode=$effectiveMode" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "mode_source=$modeSource" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "mode_override=$modeOverride" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "force_check=$($forceCheck.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "force_release=$($forceRelease.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "include_existing=$($includeExisting.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "release_channel=$releaseChannel" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "custom_tag=$($env:INPUT_CUSTOM_TAG ?? '')" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "reason=$($env:INPUT_REASON ?? '')" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "upstream_changed=$($upstreamChanged.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "previous_sha256=$($report.previousProcessedSha256)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "current_sha256=$($report.currentSha256)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "should_process=$($shouldProcess.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "run_trigger=$runTrigger" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "git_author_name=$gitAuthorName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "git_author_email=$gitAuthorEmail" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Upload upstream check artifact
        uses: actions/upload-artifact@v4
        with:
          name: autopilot-preflight-${{ github.run_id }}
          path: build/autopilot/upstream-check.json
          if-no-files-found: error

  notify_start:
    runs-on: windows-latest
    needs: preflight
    if: needs.preflight.outputs.should_process == 'true'
    environment: TgBot

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Notify Telegram about sync start
        if: env.TG_CHAT_ID != '' && env.TG_THREAD_ID != '' && (env.TG_BOT_TOKEN != '' || env.BOT_TOKEN != '')
        continue-on-error: true
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TG_THREAD_ID: ${{ secrets.TG_THREAD_ID }}
        run: |
          $ErrorActionPreference = "Stop"
          $shortHash = "${{ needs.preflight.outputs.current_sha256 }}"
          if ($shortHash.Length -gt 12) {
            $shortHash = $shortHash.Substring(0, 12)
          }

          $encodedMode = [System.Net.WebUtility]::HtmlEncode("${{ needs.preflight.outputs.effective_mode }}")
          $encodedTrigger = [System.Net.WebUtility]::HtmlEncode("${{ needs.preflight.outputs.run_trigger }}")
          $reasonLine = ""
          if ("${{ needs.preflight.outputs.reason }}") {
            $encodedReason = [System.Net.WebUtility]::HtmlEncode("${{ needs.preflight.outputs.reason }}")
            $reasonLine = "`n<b>Причина:</b> <code>$encodedReason</code>"
          }

          $runUrl = "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          $text = "⏳ <b>Автопилот перевода запущен</b>`n<b>Режим:</b> <code>$encodedMode</code>`n<b>Upstream hash:</b> <code>$shortHash</code>`n<b>Запуск:</b> <code>$encodedTrigger</code>$reasonLine`n<a href=`"$runUrl`">Открыть лог запуска</a>"
          .\scripts\send-telegram-notification.ps1 -BotToken $env:TG_BOT_TOKEN -ChatId $env:TG_CHAT_ID -ThreadId $env:TG_THREAD_ID -Text $text -DisableNotification

  run_sync:
    runs-on: windows-latest
    needs: preflight
    environment: MedvedeBear - AI
    outputs:
      status: ${{ steps.report.outputs.status }}
      process_requested: ${{ steps.report.outputs.process_requested }}
      commit_required: ${{ steps.report.outputs.commit_required }}
      tag_required: ${{ steps.report.outputs.tag_required }}
      tag_name: ${{ steps.report.outputs.tag_name }}
      translated_total: ${{ steps.report.outputs.translated_total }}
      cost_actual_known: ${{ steps.report.outputs.cost_actual_known }}
      cost_actual: ${{ steps.report.outputs.cost_actual }}
      cost_estimated: ${{ steps.report.outputs.cost_estimated }}
      missing_count: ${{ steps.report.outputs.missing_count }}
      version_mismatch_count: ${{ steps.report.outputs.version_mismatch_count }}
      stale_count: ${{ steps.report.outputs.stale_count }}
      error_message: ${{ steps.report.outputs.error_message }}
      commit_created: ${{ steps.commit.outputs.created }}
      tag_created: ${{ steps.tag.outputs.created }}
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
      AUTOPILOT_PUSH_TOKEN: ${{ secrets.AUTOPILOT_PUSH_TOKEN }}

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.AUTOPILOT_PUSH_TOKEN != '' && secrets.AUTOPILOT_PUSH_TOKEN || github.token }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Prepare workspace
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Path "build/autopilot" -Force | Out-Null
          New-Item -ItemType Directory -Path "build/translation-diff" -Force | Out-Null
          New-Item -ItemType Directory -Path ".cache/upstream" -Force | Out-Null

      - name: Download upstream check artifact
        uses: actions/download-artifact@v4
        with:
          name: autopilot-preflight-${{ github.run_id }}
          path: build/autopilot

      - name: Run autopilot
        id: autopilot
        continue-on-error: true
        run: |
          $ErrorActionPreference = "Stop"
          $args = @(
            "scripts/run-autopilot.py",
            "--mode", "${{ needs.preflight.outputs.effective_mode }}",
            "--mode-source", "${{ needs.preflight.outputs.mode_source }}",
            "--mode-override", "${{ needs.preflight.outputs.mode_override }}",
            "--trigger", "${{ needs.preflight.outputs.run_trigger }}",
            "--reason", "${{ needs.preflight.outputs.reason }}",
            "--release-channel", "${{ needs.preflight.outputs.release_channel }}",
            "--custom-tag", "${{ needs.preflight.outputs.custom_tag }}",
            "--state-path", ".github/autopilot/state.json",
            "--upstream-check-path", "build/autopilot/upstream-check.json",
            "--run-report-path", "build/autopilot/run-report.json",
            "--commit-message-path", "build/autopilot/commit-message.txt",
            "--resolved-tag-path", "build/autopilot/resolved-tag.json",
            "--repository-path", "${{ github.workspace }}"
          )

          if ("${{ needs.preflight.outputs.force_check }}" -eq "true") {
            $args += "--force-check"
          }
          if ("${{ needs.preflight.outputs.force_release }}" -eq "true") {
            $args += "--force-release"
          }
          if ("${{ needs.preflight.outputs.include_existing }}" -eq "true") {
            $args += "--include-existing"
          }

          python @args

      - name: Parse run report
        id: report
        if: always()
        run: |
          $ErrorActionPreference = "Stop"
          $report = Get-Content -Raw "build/autopilot/run-report.json" | ConvertFrom-Json
          $actions = $report.actions
          $usage = $report.usage
          $summary = $report.summary
          $errorMessage = ""
          if ($null -ne $report.error) {
            $errorMessage = [string]$report.error.message
          }
          $errorMessageSingleLine = $errorMessage.Replace("`r", " ").Replace("`n", " ").Trim()

          "status=$($report.status)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "process_requested=$($actions.processRequested.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "commit_required=$($actions.commitRequired.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag_required=$($actions.tagRequired.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag_name=$($actions.tagName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "translated_total=$($usage.translatedTotal)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "cost_actual_known=$($usage.actualCostKnown.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "cost_actual=$($usage.actualCostUsd)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "cost_estimated=$($usage.estimatedCostUsd)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "missing_count=$($summary.missingInRussianCount)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "version_mismatch_count=$($summary.versionMismatchCount)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "stale_count=$($summary.staleOnlyInRussianCount)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "error_message=$errorMessageSingleLine" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Print run report
        if: always()
        run: |
          $ErrorActionPreference = "Stop"
          Write-Host "===== build/autopilot/run-report.json ====="
          Get-Content -Raw "build/autopilot/run-report.json"
          if (Test-Path "build/translation-diff/summary.json") {
            Write-Host "===== build/translation-diff/summary.json ====="
            Get-Content -Raw "build/translation-diff/summary.json"
          }
          if (Test-Path "build/translation-diff/openrouter-usage.json") {
            Write-Host "===== build/translation-diff/openrouter-usage.json ====="
            Get-Content -Raw "build/translation-diff/openrouter-usage.json"
          }

      - name: Configure git author
        if: steps.report.outputs.status == 'success' && (steps.report.outputs.commit_required == 'true' || steps.report.outputs.tag_required == 'true')
        run: |
          $ErrorActionPreference = "Stop"
          git config user.name "${{ needs.preflight.outputs.git_author_name }}"
          git config user.email "${{ needs.preflight.outputs.git_author_email }}"
          if (-not [string]::IsNullOrWhiteSpace($env:AUTOPILOT_PUSH_TOKEN)) {
            git remote set-url origin "https://x-access-token:$env:AUTOPILOT_PUSH_TOKEN@github.com/${{ github.repository }}.git"
          }

      - name: Create commit
        id: commit
        if: steps.report.outputs.status == 'success' && steps.report.outputs.commit_required == 'true'
        run: |
          $ErrorActionPreference = "Stop"
          git add ".github/autopilot/state.json"
          git add "Mods/DnD 5.5e AIO Russian/Localization/Russian/russian.xml"
          git add "Mods/DnD 5.5e AIO Russian/meta.lsx"
          git commit --file "build/autopilot/commit-message.txt"
          "created=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Create tag
        id: tag
        if: steps.report.outputs.status == 'success' && steps.report.outputs.tag_required == 'true'
        run: |
          $ErrorActionPreference = "Stop"
          $tagName = "${{ steps.report.outputs.tag_name }}"
          if ([string]::IsNullOrWhiteSpace($tagName)) {
            throw "Tag name is empty."
          }
          git tag $tagName
          "created=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Push changes
        if: steps.report.outputs.status == 'success' && (steps.report.outputs.commit_required == 'true' || steps.report.outputs.tag_required == 'true')
        run: |
          $ErrorActionPreference = "Stop"
          $refName = "${{ github.ref_name }}"
          $tagName = "${{ steps.report.outputs.tag_name }}"
          $attempt = 0
          $maxAttempts = 3

          while ($attempt -lt $maxAttempts) {
            $attempt++
            try {
              if ("${{ steps.report.outputs.tag_required }}" -eq "true") {
                if ("${{ steps.report.outputs.commit_required }}" -eq "true") {
                  git push --atomic origin "HEAD:$refName" "refs/tags/$tagName"
                }
                else {
                  git push origin "refs/tags/$tagName"
                }
              }
              else {
                git push origin "HEAD:$refName"
              }
              break
            }
            catch {
              if ($attempt -ge $maxAttempts) {
                throw
              }
              Start-Sleep -Seconds 3
            }
          }

      - name: Write Step Summary
        if: always()
        run: |
          $ErrorActionPreference = "Stop"
          $commitCreated = if ("${{ steps.commit.outputs.created }}" -eq "true") { "true" } else { "false" }
          $tagCreated = if ("${{ steps.tag.outputs.created }}" -eq "true") { "true" } else { "false" }
          $tagName = "${{ steps.report.outputs.tag_name }}"
          $runUrl = "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          python scripts/write-autopilot-summary.py `
            --run-report-path build/autopilot/run-report.json `
            --output-path build/autopilot/step-summary.md `
            --run-url $runUrl `
            --commit-created $commitCreated `
            --tag-created $tagCreated `
            --tag-name $tagName

          Get-Content -Raw "build/autopilot/step-summary.md" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Upload autopilot artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autopilot-sync-${{ github.run_number }}
          path: |
            build/autopilot/upstream-check.json
            build/autopilot/run-report.json
            build/autopilot/step-summary.md
            build/autopilot/resolved-tag.json
            build/translation-diff/summary.json
            build/translation-diff/summary.md
            build/translation-diff/candidates.json
            build/translation-diff/openrouter-usage.json
          if-no-files-found: error

      - name: Fail workflow on autopilot error
        if: always() && steps.report.outputs.status == 'error'
        env:
          AUTOPILOT_ERROR_MESSAGE: ${{ steps.report.outputs.error_message }}
        run: |
          $ErrorActionPreference = "Stop"
          throw $env:AUTOPILOT_ERROR_MESSAGE

  notify_finish:
    runs-on: windows-latest
    needs:
      - preflight
      - run_sync
    if: always() && needs.preflight.outputs.should_process == 'true'
    environment: TgBot

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Notify Telegram about sync finish
        if: env.TG_CHAT_ID != '' && env.TG_THREAD_ID != '' && (env.TG_BOT_TOKEN != '' || env.BOT_TOKEN != '')
        continue-on-error: true
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TG_THREAD_ID: ${{ secrets.TG_THREAD_ID }}
        run: |
          $ErrorActionPreference = "Stop"
          $status = if ("${{ needs.run_sync.outputs.status }}" -eq "success") { "успех" } else { "ошибка" }
          $cost = if ("${{ needs.run_sync.outputs.cost_actual_known }}" -eq "true") { "${{ needs.run_sync.outputs.cost_actual }}" } else { "${{ needs.run_sync.outputs.cost_estimated }}" }
          if ([string]::IsNullOrWhiteSpace($cost)) {
            $cost = "0"
          }
          $costDisplay = '$' + $cost + "🇺🇸"
          try {
            $usdCost = [decimal]::Parse($cost, [System.Globalization.CultureInfo]::InvariantCulture)
          }
          catch {
            $usdCost = [decimal]::Zero
          }
          try {
            $cbrResponse = Invoke-WebRequest -UseBasicParsing -Uri "https://www.cbr.ru/scripts/XML_daily.asp" -TimeoutSec 10
            [xml]$cbrXml = $cbrResponse.Content
            $usdNode = $cbrXml.ValCurs.Valute | Where-Object { $_.CharCode -eq "USD" } | Select-Object -First 1
            if ($null -ne $usdNode) {
              $nominalText = if ($null -ne $usdNode.Nominal) { $usdNode.Nominal.ToString() } else { "1" }
              $valueRaw = if ($null -ne $usdNode.Value) { $usdNode.Value.ToString() } else { "0" }
              $nominal = [decimal]::Parse($nominalText, [System.Globalization.CultureInfo]::InvariantCulture)
              $rateText = $valueRaw.Replace(',', '.')
              $marketRate = [decimal]::Parse($rateText, [System.Globalization.CultureInfo]::InvariantCulture)
              if ($nominal -gt 0) {
                $rubCost = [decimal]::Round(($usdCost * ($marketRate / $nominal) * [decimal]"1.2"), 4, [System.MidpointRounding]::AwayFromZero)
                $rubText = $rubCost.ToString("0.####", [System.Globalization.CultureInfo]::InvariantCulture)
                $costDisplay += "| ₽$rubText🇷🇺"
              }
            }
          }
          catch {
          }
          $encodedMode = [System.Net.WebUtility]::HtmlEncode("${{ needs.preflight.outputs.effective_mode }}")
          $encodedStatus = [System.Net.WebUtility]::HtmlEncode($status)
          $commitCreated = if ("${{ needs.run_sync.outputs.commit_created }}" -eq "true") { "да" } else { "нет" }
          $tagCreated = if ("${{ needs.run_sync.outputs.tag_created }}" -eq "true") { "да" } else { "нет" }
          $encodedCommitCreated = [System.Net.WebUtility]::HtmlEncode($commitCreated)
          $encodedTagCreated = [System.Net.WebUtility]::HtmlEncode($tagCreated)
          $textLines = [System.Collections.Generic.List[string]]::new()
          $textLines.Add("🏁 <b>Автопилот перевода завершён</b>")
          $textLines.Add("<b>Статус:</b> <code>$encodedStatus</code>")
          $textLines.Add("<b>Режим:</b> <code>$encodedMode</code>")
          $textLines.Add("<b>Переведено записей:</b> <code>${{ needs.run_sync.outputs.translated_total }}</code>")
          $textLines.Add("<b>Потрачено:</b> <code>$costDisplay</code>")
          $textLines.Add("<b>Missing in Russian:</b> <code>${{ needs.run_sync.outputs.missing_count }}</code>")
          $textLines.Add("<b>Version mismatches:</b> <code>${{ needs.run_sync.outputs.version_mismatch_count }}</code>")
          $textLines.Add("<b>Stale only in Russian:</b> <code>${{ needs.run_sync.outputs.stale_count }}</code>")
          $textLines.Add("<b>Коммит создан:</b> <code>$encodedCommitCreated</code>")
          $textLines.Add("<b>Тег создан:</b> <code>$encodedTagCreated</code>")

          $tagLine = if ("${{ needs.run_sync.outputs.tag_created }}" -eq "true" -and "${{ needs.run_sync.outputs.tag_name }}") {
            $encodedTag = [System.Net.WebUtility]::HtmlEncode("${{ needs.run_sync.outputs.tag_name }}")
            "<b>Тег:</b> <code>$encodedTag</code>"
          }
          else {
            ""
          }
          if ($tagLine) {
            $textLines.Add($tagLine)
          }

          $errorLine = if ("${{ needs.run_sync.outputs.status }}" -ne "success" -and "${{ needs.run_sync.outputs.error_message }}") {
            $encodedError = [System.Net.WebUtility]::HtmlEncode("${{ needs.run_sync.outputs.error_message }}")
            "<b>Ошибка:</b> <code>$encodedError</code>"
          }
          else {
            ""
          }
          if ($errorLine) {
            $textLines.Add($errorLine)
          }

          $runUrl = "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          $textLines.Add("<a href=`"$runUrl`">Открыть лог запуска</a>")
          $text = [string]::Join("`n", $textLines)
          Write-Host "===== notify_finish telegram payload ====="
          Write-Host $text
          try {
            .\scripts\send-telegram-notification.ps1 -BotToken $env:TG_BOT_TOKEN -ChatId $env:TG_CHAT_ID -ThreadId $env:TG_THREAD_ID -Text $text
          }
          catch {
            Write-Host "===== notify_finish telegram error ====="
            Write-Host $_.Exception.Message
            throw
          }
