name: Diagnose v0.5.20 mod.io runner state
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-v0520-modio-once.yml"
permissions:
  contents: read
jobs:
  diagnose:
    if: github.event.head_commit.message == '[diagnose-modio-v0520-state]'
    runs-on: [self-hosted, Windows, bg3-toolkit]
    environment: Mod.io
    env:
      MODIO_ACCESS_TOKEN: ${{ secrets.MODIO_ACCESS_TOKEN }}
      MODIO_API_BASE: ${{ vars.MODIO_API_BASE }}
      MODIO_GAME_ID: ${{ vars.MODIO_GAME_ID }}
      MODIO_MOD_ID: ${{ vars.MODIO_MOD_ID }}
    steps:
      - name: Read sanitized browser and mod.io file state
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $result = [ordered]@{}
          try {
            $targets = @(Invoke-RestMethod -Uri "http://127.0.0.1:9222/json/list" -TimeoutSec 10)
            $pages = @($targets | Where-Object { $_.type -eq "page" })
            $categories = foreach ($page in $pages) {
              try {
                $uri = [Uri]$page.url
                if ($uri.Scheme -ne "https" -or $uri.Host -ne "mod.io") { "non_modio"; continue }
                if ($uri.AbsolutePath -eq "/g/baldursgate3") { "bg3_game_portal"; continue }
                if ($uri.AbsolutePath -eq "/g/baldursgate3/m/dnd-55e-all-in-one-beyond-russian-localization" -or $uri.AbsolutePath.StartsWith("/g/baldursgate3/m/dnd-55e-all-in-one-beyond-russian-localization/")) { "target_mod_admin_or_listing"; continue }
                if ($uri.AbsolutePath -eq "/login" -or $uri.AbsolutePath -eq "/signin") { "login_route"; continue }
                "other_modio_path"
              } catch {
                "unparseable"
              }
            }
            $result.browser = [ordered]@{
              status = "ok"
              pageCount = $pages.Count
              categories = @($categories | Group-Object | ForEach-Object { [ordered]@{ category = $_.Name; count = $_.Count } })
            }
          } catch {
            $result.browser = [ordered]@{ status = "unavailable"; errorType = $_.Exception.GetType().Name }
          }
          try {
            $base = $env:MODIO_API_BASE.TrimEnd("/")
            $game = $env:MODIO_GAME_ID
            $mod = $env:MODIO_MOD_ID
            $headers = @{ Authorization = "Bearer $env:MODIO_ACCESS_TOKEN"; Accept = "application/json" }
            $response = Invoke-RestMethod -Method Get -Uri "$base/games/$game/mods/$mod/files" -Headers $headers -TimeoutSec 20
            $files = @()
            if ($null -ne $response.data) { $files = @($response.data) } else { $files = @($response) }
            $result.modfiles = [ordered]@{
              status = "ok"
              count = $files.Count
              items = @($files | Select-Object -First 30 | ForEach-Object {
                $active = $null
                if ($_.PSObject.Properties.Name -contains "active") { $active = $_.active }
                [ordered]@{ id = $_.id; version = $_.version; active = $active; date_added = $_.date_added; virus_status = $_.virus_status }
              })
            }
            $modResponse = Invoke-RestMethod -Method Get -Uri "$base/games/$game/mods/$mod" -Headers $headers -TimeoutSec 20
            $result.mod = [ordered]@{
              status = "ok"
              id = $modResponse.id
              visible = $modResponse.visible
              statusCode = $modResponse.status
              modfile = $modResponse.modfile
            }
          } catch {
            $status = $null
            if ($_.Exception.Response) { $status = [int]$_.Exception.Response.StatusCode }
            $result.modioApi = [ordered]@{ status = "error"; httpStatus = $status; errorType = $_.Exception.GetType().Name }
          }
          $result | ConvertTo-Json -Depth 8 -Compress | Write-Output
