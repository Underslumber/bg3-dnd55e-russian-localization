name: Diagnose BG3-MODIO browser targets
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-v0520-modio-once.yml"
permissions:
  contents: read
jobs:
  diagnose:
    if: github.event.head_commit.message == '[diagnose-modio-browser-targets]'
    runs-on: [self-hosted, Windows, bg3-toolkit]
    steps:
      - name: Read sanitized CDP target classes
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $targets = @(Invoke-RestMethod -Uri "http://127.0.0.1:9222/json/list" -TimeoutSec 10)
          $pages = @($targets | Where-Object { $_.type -eq "page" })
          $classes = foreach ($page in $pages) {
            $raw = [string]$page.url
            if ($raw -match '^(?<scheme>https?)://(?<authority>[^/?#]+)(?<path>[^?#]*)') {
              $scheme = $Matches.scheme.ToLowerInvariant()
              $authority = $Matches.authority.ToLowerInvariant()
              $path = $Matches.path
              $pageHost = ($authority -split ':')[0]
              if ($scheme -ne "https") { "non_https_page"; continue }
              if ($pageHost -eq "mod.io") {
                if ($path -match '^/g/baldursgate3/?$') { "bg3_portal"; continue }
                if ($path -match '^/g/baldursgate3/m/') { "bg3_mod_route"; continue }
                if ($path -match '(?:^|/)(?:login|signin)(?:/|$)') { "modio_login_route"; continue }
                "modio_other_route"; continue
              }
              if ($pageHost -eq "larian.com" -or $pageHost.EndsWith(".larian.com")) { "larian_page"; continue }
              "other_https_page"
            } elseif ($raw -match '^(about|chrome|edge|devtools):') {
              "browser_internal_page"
            } elseif ([string]::IsNullOrWhiteSpace($raw)) {
              "empty_url"
            } else {
              "unrecognized_page"
            }
          }
          $result = [ordered]@{
            totalTargets = $targets.Count
            pageTargets = $pages.Count
            categories = @($classes | Group-Object | ForEach-Object { [ordered]@{ category = $_.Name; count = $_.Count } })
          }
          $result | ConvertTo-Json -Depth 6 -Compress | Write-Output
