name: Diagnose BG3-MODIO game route after SSO
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-v0520-modio-once.yml"
permissions:
  contents: read
jobs:
  diagnose:
    if: github.event.head_commit.message == '[diagnose-modio-browser-targets]'
    runs-on: [self-hosted, Windows, bg3-toolkit]
    steps:
      - name: Read sanitized game route
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $targets = @(Invoke-RestMethod -Uri "http://127.0.0.1:9222/json/list" -TimeoutSec 10)
          $pages = @($targets | Where-Object { $_.type -eq "page" })
          $routes = foreach ($page in $pages) {
            $raw = [string]$page.url
            if ($raw -match '^https://(?<authority>[^/?#]+)(?<path>[^?#]*)') {
              $pageHost = ($Matches.authority.ToLowerInvariant() -split ':')[0]
              $path = $Matches.path
              if ($pageHost -ne "mod.io") { if ($pageHost -eq "larian.com" -or $pageHost.EndsWith(".larian.com")) { "larian_page"; continue }; "other_https_page"; continue }
              $segments = @($path.Trim('/').Split('/') | Where-Object { $_ })
              if ($segments.Count -ge 2 -and $segments[0] -eq "g") {
                [ordered]@{ category = "modio_game_route"; gameSlug = $segments[1]; depth = $segments.Count }
                continue
              }
              [ordered]@{ category = "modio_non_game_route"; prefix = $(if ($segments.Count) { $segments[0] } else { "root" }); depth = $segments.Count }
            } else {
              "non_web_or_non_https"
            }
          }
          [ordered]@{ pageTargets = $pages.Count; routes = @($routes) } | ConvertTo-Json -Depth 6 -Compress | Write-Output
