name: Inspect mod.io login methods on BG3-MODIO
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-v0520-modio-once.yml"
permissions:
  contents: read
jobs:
  inspect:
    if: github.event.head_commit.message == '[inspect-modio-login-methods]'
    runs-on: [self-hosted, Windows, bg3-toolkit]
    steps:
      - name: Open mod.io account login and report safe method categories
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $nodeScript = @'
          const pages = (await fetch("http://127.0.0.1:9222/json/list").then(r => r.json()))
            .filter(t => t.type === "page" && /^https:\/\/mod\.io(?:\/|$)/i.test(t.url));
          if (pages.length !== 1) {
            console.log(JSON.stringify({status:"wrong_target_count", modioPages:pages.length}));
            process.exit(2);
          }
          const ws = new WebSocket(pages[0].webSocketDebuggerUrl);
          await new Promise((resolve,reject)=>{ ws.addEventListener("open",resolve,{once:true}); ws.addEventListener("error",()=>reject(new Error("CDP connect failed")),{once:true}); });
          let seq=0; const pending=new Map();
          ws.addEventListener("message",e=>{ let m; try{m=JSON.parse(e.data)}catch{return} if(m.id&&pending.has(m.id)){const p=pending.get(m.id);pending.delete(m.id);m.error?p.reject(new Error("CDP command failed")):p.resolve(m.result)}});
          const call=(method,params={})=>new Promise((resolve,reject)=>{const id=++seq;pending.set(id,{resolve,reject});ws.send(JSON.stringify({id,method,params}))});
          const evaluate=async expression=>{const response=await call("Runtime.evaluate",{expression,returnByValue:true,awaitPromise:true});if(response.exceptionDetails)throw new Error("Browser evaluation failed");return response.result?.value??null};
          try {
            await call("Page.enable");
            await call("Page.navigate",{url:"https://mod.io/g"});
            let state=null;
            for(let i=0;i<30;i++){
              await new Promise(r=>setTimeout(r,500));
              state=await evaluate(String.raw`(() => {
                const visible=e=>{const s=getComputedStyle(e),r=e.getBoundingClientRect();return s.display!=='none'&&s.visibility!=='hidden'&&Number(s.opacity)!==0&&r.width>0&&r.height>0&&!e.disabled&&e.getAttribute('aria-disabled')!=='true'};
                const labels=e=>[e.innerText,e.textContent,e.getAttribute('aria-label'),e.title].filter(Boolean).map(v=>String(v).replace(/\\s+/g,' ').trim()).filter(Boolean);
                const buttons=[...document.querySelectorAll('a,button,[role="button"]')].filter(visible);
                const login=buttons.filter(e=>labels(e).some(v=>/^(log in|sign in|войти)$/i.test(v)));
                return {modio:location.protocol==='https:'&&location.hostname==='mod.io', root:location.pathname==='/g'||location.pathname==='/g/', loginCount:login.length, loginTag:login.length===1?login[0].tagName:null, loginHrefSameSite:login.length===1&&login[0] instanceof HTMLAnchorElement?(()=>{try{return new URL(login[0].href,location.href).hostname==='mod.io'}catch{return false}})():null};
              })()`);
              if(state?.modio&&state?.loginCount!==undefined) break;
            }
            if(!state?.modio||state.loginCount!==1){console.log(JSON.stringify({status:"login_control_not_unique",modio:state?.modio,root:state?.root,loginCount:state?.loginCount}));process.exit(0);}
            const clicked=await evaluate(String.raw`(() => {
              const visible=e=>{const s=getComputedStyle(e),r=e.getBoundingClientRect();return s.display!=='none'&&s.visibility!=='hidden'&&Number(s.opacity)!==0&&r.width>0&&r.height>0&&!e.disabled&&e.getAttribute('aria-disabled')!=='true'};
              const labels=e=>[e.innerText,e.textContent,e.getAttribute('aria-label'),e.title].filter(Boolean).map(v=>String(v).replace(/\\s+/g,' ').trim()).filter(Boolean);
              const items=[...document.querySelectorAll('a,button,[role="button"]')].filter(e=>visible(e)&&labels(e).some(v=>/^(log in|sign in|войти)$/i.test(v)));
              if(items.length!==1)return false;
              if(items[0] instanceof HTMLAnchorElement)items[0].target='_self';
              items[0].click();return true;
            })()`);
            if(!clicked){console.log(JSON.stringify({status:"login_click_not_completed"}));process.exit(0);}
            await new Promise(r=>setTimeout(r,3000));
            const result=await evaluate(String.raw`(() => {
              const visible=e=>{const s=getComputedStyle(e),r=e.getBoundingClientRect();return s.display!=='none'&&s.visibility!=='hidden'&&Number(s.opacity)!==0&&r.width>0&&r.height>0&&!e.disabled&&e.getAttribute('aria-disabled')!=='true'};
              const labels=e=>[e.innerText,e.textContent,e.getAttribute('aria-label'),e.title].filter(Boolean).map(v=>String(v).replace(/\\s+/g,' ').trim()).filter(Boolean);
              const controls=[...document.querySelectorAll('a,button,[role="button"]')].filter(visible);
              const all=controls.flatMap(labels).map(v=>v.toLowerCase());
              const has=(re)=>all.some(v=>re.test(v));
              return {modio:location.protocol==='https:'&&location.hostname==='mod.io',loginPage=/login|signin/i.test(location.pathname)||location.pathname==='/g'||location.pathname==='/g/',providers:{email:has(/email|e-mail/),google:has(/google/),steam:has(/steam/),discord:has(/discord/),epic:has(/epic/),xbox:has(/xbox/),playstation:has(/playstation|psn/),apple:has(/apple/),larian:has(/larian/),otherProvider:has(/continue with|sign in with|log in with/)},passwordField:[...document.querySelectorAll('input[type="password"]')].some(visible),emailField:[...document.querySelectorAll('input[type="email"],input[autocomplete="email"]')].some(visible),codeField:[...document.querySelectorAll('input[autocomplete="one-time-code"],input[name*="code" i]')].some(visible)};
            })()`);
            console.log(JSON.stringify({status:"inspected",before:state,after:result}));
          } finally { try{ws.close()}catch{} }
          '@
          $runnerRoot = if ($env:RUNNER_ROOT) { $env:RUNNER_ROOT } else { "C:\\actions-runner" }
          $nodePath = Get-ChildItem -LiteralPath (Join-Path $runnerRoot "externals") -Directory -Filter "node*" |
            Sort-Object Name -Descending |
            ForEach-Object { Join-Path $_.FullName "bin\\node.exe" } |
            Where-Object { Test-Path -LiteralPath $_ } |
            Select-Object -First 1
          if (-not $nodePath) { throw "Runner Node.js executable was not found." }
          $tempScript = Join-Path $env:RUNNER_TEMP ("modio-login-diagnostic-" + [Guid]::NewGuid().ToString("N") + ".mjs")
          [IO.File]::WriteAllText($tempScript, $nodeScript, [Text.UTF8Encoding]::new($false))
          try { & $nodePath $tempScript } finally { Remove-Item -LiteralPath $tempScript -Force -ErrorAction SilentlyContinue }
